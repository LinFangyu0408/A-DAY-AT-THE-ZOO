  <style>
    :root {
      --bg: #f4f6fa;
      --surface: rgba(255, 255, 255, .86);
      --surface-solid: #ffffff;
      --surface-2: #eef1f7;
      --text: #18202f;
      --muted: #647087;
      --border: rgba(25, 37, 58, .12);
      --accent: #5d66f2;
      --accent-soft: rgba(93, 102, 242, .12);
      --combat: #e04d62;
      --environment: #1f9b78;
      --interactive: #d58a22;
      --two-d: #2e83d1;
      --misc: #8a65c7;
      --shadow: 0 18px 48px rgba(33, 43, 68, .10);
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e131d;
        --surface: rgba(24, 31, 44, .88);
        --surface-solid: #181f2c;
        --surface-2: #202839;
        --text: #eef2fb;
        --muted: #a7b1c5;
        --border: rgba(220, 229, 247, .13);
        --accent: #9198ff;
        --accent-soft: rgba(145, 152, 255, .16);
        --shadow: 0 20px 56px rgba(0, 0, 0, .34);
      }
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--bg); }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(93, 102, 242, .15), transparent 28rem),
        radial-gradient(circle at 90% 8%, rgba(31, 155, 120, .12), transparent 25rem),
        var(--bg);
      font-family: "Segoe UI", "Microsoft YaHei UI", "Noto Sans SC", sans-serif;
      line-height: 1.45;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    .shell { width: min(1460px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 60px; }
    .hero { display: grid; gap: 16px; padding: 30px 0 24px; }
    .eyebrow {
      display: flex; align-items: center; gap: 10px;
      color: var(--muted); font-size: 12px; font-weight: 650;
      letter-spacing: .12em; text-transform: uppercase;
    }
    .eyebrow::before {
      content: ""; width: 26px; height: 3px; border-radius: 3px;
      background: linear-gradient(90deg, var(--accent), #4cc6a3);
    }
    h1 { margin: 0; font-size: clamp(30px, 5vw, 58px); line-height: 1.03; letter-spacing: -.045em; }
    .lead { max-width: 790px; margin: 0; color: var(--muted); font-size: 16px; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .stat {
      padding: 17px 18px; border: 1px solid var(--border); border-radius: 16px;
      background: var(--surface); box-shadow: 0 8px 24px rgba(25, 35, 55, .04);
      backdrop-filter: blur(14px);
    }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { margin-top: 3px; font-size: 25px; font-weight: 720; letter-spacing: -.025em; }
    .toolbar {
      position: relative; z-index: 4; display: grid; gap: 14px;
      margin: 8px 0 22px; padding: 16px; border: 1px solid var(--border);
      border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .search-wrap { position: relative; }
    .search-icon {
      position: absolute; left: 17px; top: 50%; width: 18px; height: 18px;
      transform: translateY(-50%); color: var(--muted); pointer-events: none;
    }
    #search {
      width: 100%; min-height: 52px; padding: 12px 48px 12px 48px;
      color: var(--text); background: var(--surface-2);
      border: 1px solid transparent; border-radius: 14px; outline: none;
      font-size: 16px; transition: border-color .18s, box-shadow .18s, background .18s;
    }
    #search:focus {
      background: var(--surface-solid); border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    #clear-search {
      position: absolute; right: 9px; top: 50%; transform: translateY(-50%);
      width: 36px; height: 36px; border: 0; border-radius: 10px;
      background: transparent; cursor: pointer; color: var(--muted);
    }
    #clear-search:hover { background: var(--border); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .filter {
      min-height: 38px; padding: 7px 13px; border: 1px solid var(--border);
      border-radius: 999px; background: transparent; cursor: pointer;
      color: var(--muted); transition: .16s ease;
    }
    .filter:hover { background: var(--surface-2); color: var(--text); }
    .filter.active {
      color: var(--surface-solid); background: var(--text); border-color: var(--text);
    }
    .filter .count { margin-left: 6px; opacity: .7; font-size: 12px; }
    .status-row { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .result-count { color: var(--muted); font-size: 13px; }
    .hint { color: var(--muted); font-size: 12px; }
    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 14px; align-items: stretch;
    }
    .effect-card {
      min-width: 0; padding: 0; overflow: hidden; text-align: left; cursor: pointer;
      border: 1px solid var(--border); border-radius: 15px; background: var(--surface-solid);
      box-shadow: 0 5px 18px rgba(25, 35, 55, .055);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }
    .effect-card:hover {
      transform: translateY(-3px); border-color: color-mix(in srgb, var(--family-color) 48%, var(--border));
      box-shadow: 0 14px 34px rgba(25, 35, 55, .14);
    }
    .effect-card:focus-visible { outline: 3px solid var(--family-color); outline-offset: 2px; }
    .effect-card[data-family="战斗"] { --family-color: var(--combat); }
    .effect-card[data-family="环境"] { --family-color: var(--environment); }
    .effect-card[data-family="互动"] { --family-color: var(--interactive); }
    .effect-card[data-family="2D"] { --family-color: var(--two-d); }
    .effect-card[data-family="其他"] { --family-color: var(--misc); }
    .thumb {
      position: relative; isolate: isolate; aspect-ratio: 1.24 / 1; overflow: hidden;
      display: grid; place-items: center;
      background:
        radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--family-color) 24%, transparent), transparent 62%),
        linear-gradient(145deg, #121925, #202940);
    }
    @media (prefers-color-scheme: light) {
      .thumb { background: radial-gradient(circle, color-mix(in srgb, var(--family-color) 22%, #fff), #f1f4fa 66%); }
    }
    .thumb::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 64%, rgba(7, 11, 18, .28));
    }
    .thumb img {
      position: absolute; width: 82%; height: 82%; object-fit: contain;
      filter: drop-shadow(0 8px 18px rgba(0, 0, 0, .24));
    }
    .thumb img.ghost { opacity: .28; filter: blur(18px) saturate(1.45); transform: scale(1.18); }
    .image-count {
      position: absolute; z-index: 2; right: 9px; bottom: 8px;
      padding: 3px 7px; border-radius: 999px; color: #fff; background: rgba(8, 12, 20, .58);
      font-size: 11px; backdrop-filter: blur(8px);
    }
    .placeholder {
      position: relative; display: grid; place-items: center; width: 92px; height: 92px;
      color: #fff; border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #fff8, transparent 24%), var(--family-color);
      box-shadow: 0 0 42px color-mix(in srgb, var(--family-color) 65%, transparent);
      font-size: 34px; font-weight: 780;
    }
    .card-copy { padding: 13px 14px 15px; }
    .family-line {
      display: flex; align-items: center; gap: 7px; min-width: 0;
      color: var(--muted); font-size: 11px; white-space: nowrap;
    }
    .family-dot { flex: 0 0 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--family-color); }
    .group-name { overflow: hidden; text-overflow: ellipsis; }
    .effect-name {
      margin: 5px 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      font-size: 14px; font-weight: 680; letter-spacing: -.01em;
    }
    .empty-state {
      grid-column: 1 / -1; padding: 64px 22px; text-align: center;
      border: 1px dashed var(--border); border-radius: 18px; color: var(--muted);
    }
    .footer {
      display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px;
      margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border);
      color: var(--muted); font-size: 12px;
    }
    dialog {
      width: min(980px, calc(100% - 28px)); max-height: calc(100vh - 36px);
      padding: 0; overflow: auto; color: var(--text); background: var(--surface-solid);

    dialog::backdrop { background: rgba(8, 12, 20, .68); backdrop-filter: blur(8px); }
    .dialog-head {
      position: sticky; z-index: 3; top: 0; display: flex; justify-content: space-between;

    .preview-item {
      position: relative; aspect-ratio: 1 / 1; overflow: hidden;
      display: grid; place-items: center; border-radius: 14px;
      background: radial-gradient(circle, var(--surface-2), color-mix(in srgb, var(--accent) 12%, var(--surface-2)));

    .preview-item img { width: 84%; height: 84%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(0,0,0,.2)); }
    .preview-item span {
      position: absolute; left: 7px; right: 7px; bottom: 6px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 10px;
    }
    .details { display: grid; align-content: start; gap: 15px; }
    .detail-block { display: grid; gap: 4px; }
    .detail-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
    .detail-value { overflow-wrap: anywhere; font-size: 13px; }
    code {
      display: block; padding: 11px 12px; border-radius: 10px; background: var(--surface-2);
      color: var(--text); font: 12px/1.55 "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      overflow-wrap: anywhere;

    .no-preview { grid-column: 1 / -1; min-height: 280px; display: grid; place-items: center; color: var(--muted); }
    @media (max-width: 760px) {

      .effect-name { font-size: 12px; }
      .dialog-body { grid-template-columns: 1fr; }
      .hint { display: none; }
    }
    @media (max-width: 430px) {

      .summary { gap: 8px; }
      .stat { padding: 13px; }

    @media (prefers-reduced-motion: reduce) {

    }

rb":4,"互动 / Loot / ItemSkewedGlow":7,"互动 / Loot / ItemSparkle":7,"互动 / Loot / ItemSparkleSoft":7,"互动 / Money / Bills":4,"互动 / Money / Coins":8,"互动 / Portals / SimplePortal":5,"互动 / Portals / SoftPortal":5,"互动 / Portals / SpinPortal":5,"互动 / Portals / VortexPortal":5,"互动 / Portals / WavePortal":5,"互动 / Powerups / PowerOrb":5,"互动 / Powerups / PowerOrbElemental":5,"互动 / Powerups / PowerOrbSciFi":4,"互动 / Powerups / PowerOrbSmall":5,"互动 / Powerups / PowerupActivate":5,"互动 / Powerups / PowerupGlow":6,"互动 / Sparkle":1,"互动 / Sparkle / SparkleArea":5,"互动 / Sparkle / SparkleSolo":5,"互动 / Stars":5,"互动 / Trails":5,"互动 / Zone / BasicZone":6,"互动 / Zone / BasicZoneWall":6,"互动 / Zone / MagicZone":4,"互动 / Zone / SpinZone":2,"2D / Blood / Green":5,"2D / Blood / Red":5,"2D / Blood / Yellow":5,"2D / Explosions":3,"2D / Water / Flowing":4,"2D / Weather":1,"其他 / 互动杂项":8},"summary":{"effects":915,"groups":199,"textures":157,"missingImages":0}}</script>
  <script>
    (() => {
      const catalog = JSON.parse(document.getElementById("catalog-data").textContent);
      const records = catalog.records;
      const grid = document.getElementById("grid");
      const filters = document.getElementById("filters");
      const search = document.getElementById("search");
      const clearSearch = document.getElementById("clear-search");
      const resultCount = document.getElementById("result-count");
      const dialog = document.getElementById("effect-dialog");
      const closeDialog = document.getElementById("close-dialog");
      const familyNames = ["全部", "战斗", "环境", "互动", "2D", "其他"];
      let activeFamily = "全部";

      document.getElementById("stat-effects").textContent = catalog.summary.effects.toLocaleString("zh-CN");
      document.getElementById("stat-groups").textContent = catalog.summary.groups.toLocaleString("zh-CN");
      document.getElementById("stat-textures").textContent = catalog.summary.textures.toLocaleString("zh-CN");

      for (const family of familyNames) {
        const count = family === "全部" ? records.length : (catalog.familyCounts[family] || 0);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "filter" + (family === "全部" ? " active" : "");
        button.dataset.family = family;
        button.setAttribute("aria-pressed", family === "全部" ? "true" : "false");
        button.innerHTML = `${family}<span class="count">${count}</span>`;
        button.addEventListener("click", () => setFamily(family));
        filters.append(button);
      }

      function setFamily(family) {
        activeFamily = family;
        for (const button of filters.querySelectorAll(".filter")) {
          const selected = button.dataset.family === family;
          button.classList.toggle("active", selected);
          button.setAttribute("aria-pressed", String(selected));
        }
        render();
      }

      function makeCard(record) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "effect-card";
        card.dataset.family = record.family;
        card.setAttribute("aria-label", `${record.name}，${record.group}`);
        card.addEventListener("click", () => openEffect(record));

        const thumb = document.createElement("div");
        thumb.className = "thumb";
        if (record.images.length) {
          const previewSrc = record.preview || record.images[0].src;
          const ghost = document.createElement("img");
          ghost.className = "ghost";
          ghost.src = previewSrc;
          ghost.alt = "";
          ghost.loading = "lazy";
          const image = document.createElement("img");
          image.src = previewSrc;
          image.alt = `${record.name} 纹理预览`;
          image.loading = "lazy";
          image.decoding = "async";
          thumb.append(ghost, image);
          if (record.images.length > 1) {
            const count = document.createElement("span");
            count.className = "image-count";
            count.textContent = `${record.images.length} 张纹理`;
            thumb.append(count);
          }
        } else {
          const placeholder = document.createElement("span");
          placeholder.className = "placeholder";
          placeholder.textContent = record.name.slice(0, 1).toUpperCase();
          thumb.append(placeholder);
        }

        const copy = document.createElement("div");
        copy.className = "card-copy";
        const familyLine = document.createElement("div");
        familyLine.className = "family-line";
        const dot = document.createElement("span");
        dot.className = "family-dot";
        const group = document.createElement("span");
        group.className = "group-name";
        group.textContent = record.group;
        familyLine.append(dot, group);
        const name = document.createElement("div");
        name.className = "effect-name";
        name.textContent = record.name;
        copy.append(familyLine, name);
        card.append(thumb, copy);
        return card;
      }

      function render() {
        const query = search.value.trim().toLowerCase();
        const compactQuery = query.replace(/[\s_\-]+/g, "");
        const matches = records.filter(record =>
          (activeFamily === "全部" || record.family === activeFamily) &&
          (!compactQuery || record.search.includes(compactQuery))
        );

        const fragment = document.createDocumentFragment();
        for (const record of matches) fragment.append(makeCard(record));
        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.textContent = "没有找到匹配的特效，请尝试更短的英文名称或分类词。";
          fragment.append(empty);
        }
        grid.replaceChildren(fragment);
        resultCount.textContent = `显示 ${matches.length.toLocaleString("zh-CN")} / ${records.length.toLocaleString("zh-CN")} 个特效`;
      }

      function openEffect(record) {
        document.getElementById("dialog-kicker").textContent = record.family;
        document.getElementById("dialog-title").textContent = record.name;
        document.getElementById("dialog-group").textContent = record.group;
        document.getElementById("dialog-prefab").textContent = record.name + ".prefab";
        document.getElementById("dialog-path").textContent = record.path;
        document.getElementById("dialog-textures").textContent = record.images.length
          ? `${record.images.length} 张实际引用纹理`
          : "该 Prefab 未解析到独立纹理";

        const previews = document.getElementById("preview-grid");
        previews.replaceChildren();
        if (record.images.length) {
          if (record.preview) {
            const composite = document.createElement("div");
            composite.className = "preview-item";
            const compositeImage = document.createElement("img");
            compositeImage.src = record.preview;
            compositeImage.alt = `${record.name} 合成颜色预览`;
            const compositeLabel = document.createElement("span");
            compositeLabel.textContent = "按粒子颜色合成的预览";
            composite.append(compositeImage, compositeLabel);
            previews.append(composite);
          }
          for (const image of record.images.slice(0, 10)) {
            const item = document.createElement("div");
            item.className = "preview-item";
            const img = document.createElement("img");
            img.src = image.src;
            img.alt = `${record.name} 的纹理 ${image.name}`;
            const label = document.createElement("span");
            label.textContent = image.name;
            item.append(img, label);
            previews.append(item);
          }
        } else {
          const empty = document.createElement("div");
          empty.className = "no-preview";
          empty.textContent = "无独立纹理预览";
          previews.append(empty);
        }
        dialog.showModal();
      }

      closeDialog.addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", event => {
        if (event.target === dialog) dialog.close();
      });
      search.addEventListener("input", render);
      clearSearch.addEventListener("click", () => {
        search.value = "";
        search.focus();
        render();
      });
      render();
    })();
  </script>
